name: Refresh Climate Baselines

on:
  schedule:
    - cron: '0 2 1 * *'   # 1st of every month at 02:00 UTC
  workflow_dispatch:        # allow manual runs

permissions:
  contents: write

jobs:
  fetch-baselines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx numpy

      - name: Clear existing fixture
        run: rm -f data/baselines.json

      - name: Fetch baselines from NASA POWER
        run: python scripts/fetch_baselines.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/baselines.json
          git diff --cached --quiet && echo "No changes to commit." || (
            git commit -m "chore: refresh climate baselines from NASA POWER [skip ci]" &&
            git push
          )
