name: Refresh Climate Baselines

on:
  schedule:
    - cron: '0 2 1 * *'   # 1st of every month at 02:00 UTC
  workflow_dispatch:        # allow manual runs
    inputs:
      source:
        description: 'Data source (nasa or era5)'
        required: false
        default: 'era5'
        type: choice
        options: [era5, nasa]

permissions:
  contents: write

jobs:
  fetch-baselines:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install httpx numpy pandas cdsapi xarray netCDF4

      - name: Clear existing fixture
        run: rm -f data/baselines.json

      - name: Fetch baselines (ERA5 preferred, NASA POWER fallback)
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          SOURCE="${{ github.event.inputs.source || 'era5' }}"
          if [ "$SOURCE" = "era5" ] && [ -n "$CDS_API_KEY" ]; then
            echo "Using ERA5 (Copernicus CDS)"
            python scripts/fetch_baselines.py --source era5
          else
            echo "Using NASA POWER (no CDS_API_KEY or source=nasa)"
            python scripts/fetch_baselines.py --source nasa --workers 4
          fi

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }}
          git add data/baselines.json
          git diff --cached --quiet && echo "No changes to commit." || (
            git commit -m "chore: refresh climate baselines" &&
            git push origin ${{ github.ref_name }}
          )
